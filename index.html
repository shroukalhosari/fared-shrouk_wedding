<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fared & Shrouk Wedding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;700&family=Cairo:wght@300;600&display=swap" rel="stylesheet">

<style>
.fancy-name{
    font-family:'Great Vibes', cursive !important;
    font-size:80px;
    color:#8b0000;
    text-align:center;
    letter-spacing:2px;
    animation:glow 3s infinite ease-in-out;
}

@keyframes glow{
    0%{opacity:.6; transform:translateY(-3px);}
    50%{opacity:1; transform:translateY(0);}
    100%{opacity:.6; transform:translateY(-3px);}
}

@keyframes glow{
    0%{opacity:.7;}
    50%{opacity:1;}
    100%{opacity:.7;}
}

@keyframes glow{
    0%{
        opacity:.7;
        transform:translateY(-3px);
    }
    50%{
        opacity:1;
        transform:translateY(0);
    }
    100%{
        opacity:.7;
        transform:translateY(-3px);
    }
}
body{
    margin:0;
    font-family:'Cairo', sans-serif;
    background:#fff0f5;
    text-align:center;
}

/* شاشة البداية */
#welcome{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#fff0f5;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    padding:20px;
}

#welcome h1{
    font-size:38px;
    color:maroon;
    line-height:2;
    font-family:'El Messiri', sans-serif;
    width:80%;
}

/* العنوان */
.header{
    font-size:55px;
    color:maroon;
    margin-top:30px;
    font-family:'El Messiri', sans-serif;
}

/* العداد */
.count-container{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:30px;
    flex-wrap:wrap;
}

.box{
    background:white;
    width:120px;
    height:120px;
    border-radius:20px;
    box-shadow:0 0 10px #ddd;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.number{
    font-size:30px;
    font-weight:bold;
    color:maroon;
}

.label{
    color:gray;
    margin-top:5px;
}

/* الكروت */
.container{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:50px;
}

.card{
    background:white;
    width:250px;
    padding:20px;
    border-radius:20px;
    box-shadow:0 0 10px #ddd;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

/* الصورة */
img{
    width:300px;
    margin-top:50px;
    margin-bottom:40px;
    border-radius:20px;
    box-shadow:0 0 10px #ccc;
}

/* التعليقات */
.comment-section {
    max-width: 500px;
    margin: 40px auto 30px auto;
    padding: 25px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 0 10px #ddd;
    width: 85%;
}

.comment-form input,
.comment-form textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-family: 'Cairo', sans-serif;
}

.comment-form button {
    width: 100%;
    padding: 12px;
    background: maroon;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.comments-display {
    max-width: 500px;
    margin: auto;
    width: 85%;
}

.comment-box {
    background: white;
    padding: 15px;
    margin-top: 10px;
    border-radius: 15px;
    box-shadow: 0 0 10px #ddd;
    text-align:right;
}

.comment-user {
    font-weight:bold;
    color:maroon;
}

.delete-btn {
    margin-top:10px;
    background:#7b1b3a;
    color:white;
    border:none;
    padding:6px 10px;
    border-radius:8px;
    cursor:pointer;
}
.bg-overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:url("shrouk77.jpeg") center/cover no-repeat;
    opacity:0.15;
    z-index:-1;
}
</style>
</head>

<body>
    <div class="bg-overlay"></div>
<audio id="bg-music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>
<!-- شاشة البداية -->
<div id="welcome">
    <h1>
        ولقد بنيت لك بين أضلعي منزلاً عسى المقام بالمقيم يليق، فمرحباً بك أولاً وثانياً، عمراً وأخيراً ♥️💍
    </h1>
</div>

<!-- الاسم -->
<div class="header fancy-name">
Fared & Shrouk
</div>

<div style="font-size:30px;color:maroon;margin-top:-10px;">
♥️💍
</div>

<!-- العداد -->
<div class="count-container">
    <div class="box"><div class="number" id="days">0</div><div class="label">Days</div></div>
    <div class="box"><div class="number" id="hours">0</div><div class="label">Hours</div></div>
    <div class="box"><div class="number" id="minutes">0</div><div class="label">Minutes</div></div>
    <div class="box"><div class="number" id="seconds">0</div><div class="label">Seconds</div></div>
</div>

<!-- الكروت -->
<div class="container">
    <div class="card">
        <div class="title">Katb Ketab</div>
        <div>25/6/2026</div>
        <div>Elryan Hall</div>
    </div>

    <div class="card">
        <div class="title">Wedding</div>
        <div>29/6/2026</div>
        <div>G-Marriott Hall</div>
    </div>
</div>

<img src="shrouk77.jpeg">

<!-- التعليقات -->
<div class="comment-section">
    <h2>A message with love ❤️</h2>

    <input id="userName" placeholder="الاسم"> <br> <br>
    <textarea id="userComment" placeholder=" رسالتك او مباركتك هنا"></textarea> <br>
    <button onclick="addComment()">إرسال ✨</button> <br>
</div>

<div class="comments-display" id="commentsDisplay"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>

/* Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyAO1fqSBUIqIH-wg7ZiapUg9Qpd6q1Q4go",
  authDomain: "wedding-site-68ad0.firebaseapp.com",
  databaseURL: "https://wedding-site-68ad0-default-rtdb.firebaseio.com",
  projectId: "wedding-site-68ad0",
  storageBucket: "wedding-site-68ad0.firebasestorage.app",
  messagingSenderId: "830568343559",
  appId: "1:830568343559:web:5bd105f3b40b2b568122a2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* العد التنازلي */
let weddingDate = new Date("Jun 29, 2026 12:00:00").getTime();

setInterval(()=>{
    let now = new Date().getTime();
    let d = weddingDate - now;

    document.getElementById("days").innerHTML = Math.floor(d/86400000);
    document.getElementById("hours").innerHTML = Math.floor((d%86400000)/3600000);
    document.getElementById("minutes").innerHTML = Math.floor((d%3600000)/60000);
    document.getElementById("seconds").innerHTML = Math.floor((d%60000)/1000);
},1000);

/* شاشة البداية */
setTimeout(()=>{
document.getElementById("welcome").style.display="none";
},3000);

/* التعليقات */
function addComment(){
    let name = document.getElementById("userName").value; 
    let comment = document.getElementById("userComment").value;

    if(!name || !comment) return;

    db.ref("comments").push({
        username:name,
        text:comment
    });

    document.getElementById("userName").value="";
    document.getElementById("userComment").value="";
}

function deleteComment(id){
    let password = prompt("اكتب كلمة السر لحذف التعليق:");

    if(password === "1999"){
        db.ref("comments/"+id).remove();
        alert("تم الحذف ✅");
    } else {
        alert("كلمة السر غلط ❌");
    }
}

function loadComments(){
    db.ref("comments").on("value", snap=>{
        let data = snap.val();
        let box = document.getElementById("commentsDisplay");
        box.innerHTML="";

        for(let id in data){
            box.innerHTML += `
            <div class="comment-box">
                <div class="comment-user">${data[id].username}</div>
                <div>${data[id].text}</div>

                <button class="delete-btn" onclick="deleteComment('${id}')">
                    حذف 🗑️
                </button>
            </div>`;
        }
    });
}

window.onload = loadComments;
const music = document.getElementById("bg-music");

document.addEventListener("click", function(){
    music.play();
}, { once:true });
</script>

</body>
</html>
